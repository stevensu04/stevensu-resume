<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <!-- Real rank_regions output for countries=["EU"], live Electricity Maps data at 2026-09-22 10:00 UTC (gCO2e/kWh). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07141a"/>
      <stop offset="1" stop-color="#0d2420"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0.1" r="0.8">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <g transform="translate(0 48)">
  <!-- Agent prompt -->
  <g transform="translate(120 110)">
    <rect width="1360" height="120" rx="24" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
    <circle cx="60" cy="60" r="22" fill="#10b981" fill-opacity="0.18"/>
    <path d="M52 60h16M60 52v16" stroke="#34d399" stroke-width="4" stroke-linecap="round"/>
    <text x="104" y="52" font-size="22" font-weight="700" fill="#6ee7b7" letter-spacing="3">AGENT → rank_regions</text>
    <text x="104" y="88" font-size="30" fill="#e2e8f0">“Run this training job in the EU, lowest carbon first.”</text>
  </g>

  <!-- Column header -->
  <g font-size="20" font-weight="700" fill="#94a3b8" letter-spacing="3">
    <text x="150" y="300">REGION</text>
    <text x="700" y="300">GRID CARBON INTENSITY</text>
    <text x="1450" y="300" text-anchor="end">gCO₂e/kWh</text>
  </g>

  <!-- Rows: bar width = intensity × 2 -->
  <g font-size="30">
    <g transform="translate(120 330)">
      <rect width="1360" height="96" rx="20" fill="#10b981" fill-opacity="0.14" stroke="#34d399" stroke-opacity="0.5"/>
      <text x="36" y="60" font-weight="800" fill="#34d399">1</text>
      <text x="84" y="47" font-weight="700" fill="#f8fafc">eu-west-3</text>
      <text x="84" y="76" font-size="20" fill="#94a3b8">AWS · Paris</text>
      <rect x="580" y="38" width="42" height="20" rx="10" fill="#34d399"/>
      <text x="1330" y="60" text-anchor="end" font-weight="700" fill="#f8fafc">21</text>
    </g>
    <g transform="translate(120 446)">
      <rect width="1360" height="96" rx="20" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08"/>
      <text x="36" y="60" font-weight="800" fill="#6ee7b7">2</text>
      <text x="84" y="47" font-weight="700" fill="#f8fafc">francecentral</text>
      <text x="84" y="76" font-size="20" fill="#94a3b8">Azure · Paris</text>
      <rect x="580" y="38" width="42" height="20" rx="10" fill="#34d399"/>
      <text x="1330" y="60" text-anchor="end" font-weight="700" fill="#f8fafc">21</text>
    </g>
    <g transform="translate(120 562)">
      <rect width="1360" height="96" rx="20" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08"/>
      <text x="36" y="60" font-weight="800" fill="#6ee7b7">5</text>
      <text x="84" y="47" font-weight="700" fill="#f8fafc">eu-north-1</text>
      <text x="84" y="76" font-size="20" fill="#94a3b8">AWS · Stockholm</text>
      <rect x="580" y="38" width="60" height="20" rx="10" fill="#34d399"/>
      <text x="1330" y="60" text-anchor="end" font-weight="700" fill="#f8fafc">30</text>
    </g>
    <g transform="translate(120 678)" opacity="0.6">
      <rect width="1360" height="96" rx="20" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.06"/>
      <text x="36" y="60" font-weight="800" fill="#94a3b8">…</text>
      <text x="84" y="47" font-weight="700" fill="#cbd5e1">eu-central-1</text>
      <text x="84" y="76" font-size="20" fill="#94a3b8">AWS · Frankfurt</text>
      <rect x="580" y="38" width="570" height="20" rx="10" fill="#f97316"/>
      <text x="1330" y="60" text-anchor="end" font-weight="700" fill="#cbd5e1">285</text>
    </g>
  </g>

  </g>

  <text x="1480" y="870" text-anchor="end" font-size="20" fill="#64748b">Live snapshot · 22 Sep 2026 · Source: ElectricityMaps.com</text>
</svg>
